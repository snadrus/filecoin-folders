# Sponsor backend on Cloudflare (Calibration / Stripe test mode only).
#   cd apps/fifolders/sponsor && npx wrangler deploy
# Secrets: wrangler secret put SPONSOR_KEY | STRIPE_WEBHOOK_SECRET | STRIPE_SECRET_KEY (test key, when it exists)
name = "fifolders-sponsor"
main = "worker.ts"
compatibility_date = "2025-09-01"
compatibility_flags = ["nodejs_compat"]
account_id = "b10ebe4ff9e05d7cca47b48a805b828f"
workers_dev = true
routes = [{ pattern = "fast.scionbase.ai", custom_domain = true }]

[vars]
SPONSOR_NETWORK = "calibration"
SPONSOR_FACTORY = "0x228867301f1f0EaF75b5d7af62F3c44e1796A56D"
SPONSOR_PROVIDER_ID = "2"
SPONSOR_POOL_SIZE = "2"
SPONSOR_POOL_SEED_USDFC = "1"
SPONSOR_SWEEP_ACCOUNTS = "0x2CcbFfB44b410BDa7Fcb7708d1649bA2887370d2"
SPONSOR_ALLOWED_ORIGINS = "https://fifolders.scionbase.ai/,http://localhost"
# v2 beacon factory (Calibration, 2026-11-26). Beacon owner is Andy's Ledger 0xD62bD538bcEaB1284950E513f6Da796dD790642a after recover.ts --hand-beacon (never the f1 masked-ID). Upgrades: docs/beacon-upgrade.md.
SPONSOR_FACTORY_LEGACY = "0xCBb99E41C173B06D15212A135ba9F46AAB19DEE5"
SPONSOR_REGISTRY = "0x9C06335D7DE588Caa104ee4FC3bb7cd8Aba62443"
SPONSOR_BEACON = "0xbF8D1Ff1c632E953c52Cc4a7CdFD81E17374D9fA"
SPONSOR_GAS_HOURLY_FIL = "0.01"
SPONSOR_GAS_BURST_FIL = "0.03"
SPONSOR_GAS_DAILY_FIL = "0.05"
SPONSOR_GAS_LIFETIME_BASE_FIL = "0.01"
SPONSOR_GAS_LIFETIME_PER_PURCHASE_FIL = "0.002"
# Filecoin EVM gas units are much larger than Ethereum; 10M blocked addSessionKey (~62M used, ~221M estimated).
SPONSOR_GAS_TX_MAX_GAS = "500000000"
SPONSOR_GAS_TX_MAX_FEE_FIL = "0.01"
SPONSOR_GAS_SESSION_DAILY_FIL = "0.02"
SPONSOR_GAS_IP_HOURLY_FIL = "0.03"
SPONSOR_GAS_FIL_FLOOR_FIL = "0.05"
# Mainnet (/mainnet). v2 beacon factory deployed 2026-11-27 (deployments/mainnet-factory-v2.json):
# admin = sponsor 0xa69A…08Db, treasury = recovery f03775120 (masked ID), beacon owner = Andy's Ledger 0xD62b…642a.
# SPONSOR_KEY_MAINNET is a secret. The pool and checkout stay idle until the sponsor holds USDFC
# (refill and checkout both check balances first). Do not add mainnet to VITE_SPONSOR_NETWORKS until then.
SPONSOR_FACTORY_MAINNET = "0xA06109D9cdA71e1691d910B2DE44839F4723c83e"
SPONSOR_FACTORY_LEGACY_MAINNET = "0xaaA1795A150BA01F7A5894A3D1A95334B695F067"
SPONSOR_BEACON_MAINNET = "0xcF97b581b8e6045173eeA187AbBAF87547e19EC1"
SPONSOR_PROVIDER_ID_MAINNET = "5"
SPONSOR_POOL_SIZE_MAINNET = "2"
SPONSOR_ALLOWED_ORIGINS_MAINNET = "https://fifolders.scionbase.ai/"
SPONSOR_REGISTRY_MAINNET = "0x0ADf3E4fc709EAC4973Ca5D17FCfEB10eB7b01EB"

[[durable_objects.bindings]]
name = "SPONSOR"
class_name = "SponsorDO"

[[durable_objects.bindings]]
name = "SPONSOR_MAINNET"
class_name = "SponsorMainnetDO"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SponsorDO"]

[[migrations]]
tag = "v2"
new_sqlite_classes = ["SponsorMainnetDO"]

[triggers]
crons = ["*/10 * * * *"]

[observability]
enabled = true
