name: deploy-v2-factory

# Deploys LockedSignerAccountBeaconFactory (v2). Calibration or mainnet.
# The sponsor key is injected as SPONSOR_KEY from a GitHub secret and is never printed.
# Public addresses are written to the job summary and an artifact.
# If deployments/calibration-factory-v2.json already points at a live contract, this
# job prints those addresses and does not send another deploy transaction.
# Mainnet (when enabled): deploy-v2.ts reads deployments/beacon-owner.json (or
# BEACON_OWNER) and transfers beacon ownership to that Ledger EOA right after deploy.
on:
  workflow_dispatch:
    inputs:
      network:
        description: "Chain to deploy the v2 beacon factory on"
        required: true
        type: choice
        options:
          - calibration
          - mainnet
        default: calibration

permissions:
  contents: read

concurrency:
  group: deploy-v2-factory
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - uses: foundry-rs/foundry-toolchain@dba66c27052e63476d886f22216e119ba7e615bf # v1
      - run: pnpm install --frozen-lockfile
      - name: Build packages the deploy script imports
        run: pnpm --filter fil-folders build
      - name: Deploy v2 factory
        env:
          SPONSOR_KEY_CALIBRATION: ${{ secrets.SPONSOR_KEY_CALIBRATION }}
          SPONSOR_KEY_MAINNET: ${{ secrets.SPONSOR_KEY_MAINNET }}
          SPONSOR_NETWORK: ${{ inputs.network }}
          CALIBRATION_RPC: https://api.calibration.node.glif.io/rpc/v1
          MAINNET_RPC: https://api.node.glif.io/rpc/v1
        run: |
          set -euo pipefail
          NETWORK="${SPONSOR_NETWORK}"
          if [ "$NETWORK" != "calibration" ] && [ "$NETWORK" != "mainnet" ]; then
            echo "Unsupported network=${NETWORK}"
            exit 1
          fi
          if [ "$NETWORK" = "calibration" ]; then
            export SPONSOR_KEY="${SPONSOR_KEY_CALIBRATION:-}"
            RECORD=deployments/calibration-factory-v2.json
            RPC="$CALIBRATION_RPC"
          else
            export SPONSOR_KEY="${SPONSOR_KEY_MAINNET:-}"
            RECORD=deployments/mainnet-factory-v2.json
            RPC="$MAINNET_RPC"
          fi
          unset SPONSOR_KEY_CALIBRATION SPONSOR_KEY_MAINNET

          publish() {
            local file="$1"
            jq -e --arg net "$NETWORK" '.address and .beacon and .implementation and .network == $net' "$file" >/dev/null
            jq '{factory: .address, beacon, implementation, txHash, block, admin, treasury, registry, beaconOwner, handBeaconTx}' "$file"
            {
              echo "### ${NETWORK} v2 factory"
              echo
              jq -r '"- factory: `\(.address)`\n- beacon: `\(.beacon)`\n- implementation: `\(.implementation)`\n- beaconOwner: `\(.beaconOwner // .intendedBeaconOwner)`\n- tx: `\(.txHash)`\n- handBeaconTx: `\(.handBeaconTx // "n/a")`"' "$file"
            } >> "$GITHUB_STEP_SUMMARY"
          }

          if [ -f "$RECORD" ]; then
            addr=$(jq -r .address "$RECORD")
            code=$(cast code "$addr" --rpc-url "$RPC" || true)
            if [ "${#code}" -gt 4 ]; then
              echo "Factory already deployed at $addr; not sending another transaction."
              publish "$RECORD"
              exit 0
            fi
          fi

          if [ -z "${SPONSOR_KEY:-}" ]; then
            echo "Sponsor key for ${NETWORK} is not set"
            exit 1
          fi
          forge build --root contracts
          set +e
          ./node_modules/.bin/tsx apps/fifolders/sponsor/deploy-v2.ts > "$RUNNER_TEMP/deploy-v2.out" 2> "$RUNNER_TEMP/deploy-v2.err"
          status=$?
          set -e
          if [ "$status" -ne 0 ]; then
            echo "deploy-v2 failed (exit $status). stderr (secrets are masked by GitHub):"
            tail -c 4000 "$RUNNER_TEMP/deploy-v2.err" || true
            exit "$status"
          fi
          python3 -c "
import json,sys
from pathlib import Path
raw=Path(sys.argv[1]).read_text()
dec=json.JSONDecoder(); objs=[]; i=0
while True:
    s=raw.find('{', i)
    if s<0: break
    try:
        obj, end=dec.raw_decode(raw, s); objs.append(obj); i=end
    except json.JSONDecodeError:
        i=s+1
recs=[o for o in objs if isinstance(o, dict) and o.get('address') and o.get('beacon')]
assert recs, 'deploy-v2 produced no factory JSON'
Path(sys.argv[2]).write_text(json.dumps(recs[-1], indent=2)+chr(10))
" "$RUNNER_TEMP/deploy-v2.out" "$RUNNER_TEMP/deploy-v2.json"
          mkdir -p deployments
          cp "$RUNNER_TEMP/deploy-v2.json" "$RECORD"
          publish "$RUNNER_TEMP/deploy-v2.json"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ inputs.network }}-factory-v2
          path: deployments/${{ inputs.network }}-factory-v2.json
          if-no-files-found: error
