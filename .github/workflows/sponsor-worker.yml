name: sponsor-worker

# Deploys the gasless sponsor (apps/fifolders/sponsor/worker.ts) to Cloudflare at fast.scionbase.ai and installs its
# secrets from GitHub Actions secrets. Secrets never touch the repo or the log (piped through a temp file in $RUNNER_TEMP).
on:
  push:
    branches: [main]
    paths:
      - "apps/fifolders/sponsor/**"
      - "apps/fifolders/src/sponsored-abi.ts"
      - "apps/fifolders/src/receipt.ts"
      - "packages/sponsored-client/**"
      - ".github/workflows/sponsor-worker.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sponsor-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 10
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build workspace packages the worker imports
        run: pnpm --filter fil-folders build && pnpm --filter @fifolders/sponsored-client build
      - name: Typecheck worker
        working-directory: apps/fifolders/sponsor
        run: npx tsc -p tsconfig.worker.json
      - name: Deploy
        working-directory: apps/fifolders/sponsor
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npx wrangler deploy
      - name: Secrets
        working-directory: apps/fifolders/sponsor
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          SPONSOR_KEY: ${{ secrets.SPONSOR_KEY_CALIBRATION }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          STRIPE_WEBHOOK_SECRET: ${{ secrets.STRIPE_WEBHOOK_SECRET }}
          SPONSOR_KEY_MAINNET: ${{ secrets.SPONSOR_KEY_MAINNET }}
          STRIPE_LIVE_SECRET_KEY: ${{ secrets.STRIPE_LIVE_SECRET_KEY }}
          STRIPE_LIVE_WEBHOOK_SECRET: ${{ secrets.STRIPE_LIVE_WEBHOOK_SECRET }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          umask 077
          f="$RUNNER_TEMP/secrets.json"
          # Only non-empty secrets are uploaded (an unset GitHub secret leaves the Worker's value alone).
          jq -n 'env | with_entries(select(.key | test("^(SPONSOR_KEY|SPONSOR_KEY_MAINNET|STRIPE_SECRET_KEY|STRIPE_WEBHOOK_SECRET|STRIPE_LIVE_SECRET_KEY|STRIPE_LIVE_WEBHOOK_SECRET|RESEND_API_KEY)$")) | select(.value != ""))' > "$f"
          npx wrangler secret bulk "$f" > /dev/null
          rm -f "$f"
          echo "secrets updated: $(jq -n 'env | [keys[] | select(test("^(SPONSOR_KEY|SPONSOR_KEY_MAINNET|STRIPE_SECRET_KEY|STRIPE_WEBHOOK_SECRET|STRIPE_LIVE_SECRET_KEY|STRIPE_LIVE_WEBHOOK_SECRET|RESEND_API_KEY)$"))] | join(",")')"
      - name: Health
        run: |
          sleep 10
          for path in health mainnet/health; do
            body=$(curl -sS "https://fast.scionbase.ai/$path" || echo '{}')
            echo "$path: $body"
            # Surface low/empty sponsor wallets and an empty pool as run annotations (the deploy itself succeeded).
            echo "$body" | jq -r --arg p "$path" '(.warnings // [])[] | "::warning title=sponsor \($p)::\(.)"' || true
          done
          curl -fsS https://fast.scionbase.ai/health > /dev/null
