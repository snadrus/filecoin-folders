name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      collab_ref:
        description: collab-edit ref to build (branch, tag, or commit)
        required: false
        default: p2p
        type: string
  repository_dispatch:
    types: [collab-edit]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  COLLAB_REPO: snadrus/collab-edit
  COLLAB_REF: p2p

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.COLLAB_REPO }}
          ref: ${{ github.event.inputs.collab_ref || github.event.client_payload.ref || env.COLLAB_REF }}
          path: collab-edit
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter fil-folders build
      - run: pnpm --filter fiperson build
      - run: pnpm --filter @fifolders/sponsored-client build
      - run: pnpm --filter fifolders build
        env:
          # Gasless mode on Calibration: sponsor Worker (apps/fifolders/sponsor/worker.ts) + Stripe test mode.
          VITE_SPONSOR_URL: https://fast.scionbase.ai
          # Mainnet sponsor (served at /mainnet) is deployed; add it here once its wallet holds USDFC.
          VITE_SPONSOR_NETWORKS: calibration
          # Mainnet FolderRegistryV2 (deployments/mainnet-v2.json).
          VITE_FOLDER_REGISTRY_MAINNET: "0x0ADf3E4fc709EAC4973Ca5D17FCfEB10eB7b01EB"
          VITE_REGISTRY_FROM_BLOCK_MAINNET: "6580537"
          VITE_STRIPE_PUBLISHABLE_KEY_MAINNET: pk_live_51Ug71bAQKJpucjVchcZvlNbOViSWgtgYn98cVWpw7EudZ7rZQLgUJty5pb1NoWXF2jkuBv9Mwrzby3UDKBzyqaaB00UrydX8lE
          VITE_STRIPE_PUBLISHABLE_KEY: pk_test_51Ug4s1AFTWNVBowWWqiKGCzkvif6rJKZQmzCHfLHobIBYyb82eWvIUg1jmLlk3A6k83AYGPd7BomXHwvGyFlqnGS00Pz8paxAS
      - name: Build FiPen and FiGrid
        working-directory: collab-edit
        run: |
          if [ ! -f p2p/src/host-base.ts ]; then
            git apply --check ../scripts/collab-edit-p2p.patch
            git apply ../scripts/collab-edit-p2p.patch
          fi
          npm install --ignore-scripts
          node scripts/install-fil-folders.mjs
          # FiPen/FiGrid must use this commit's fil-folders (e.g. 360-block log scans), not the older pin.
          rm -rf node_modules/fil-folders/dist
          cp -R ../packages/fil-folders/dist node_modules/fil-folders/dist
          # Same for FiPerson (names, identity, avatars).
          rm -rf node_modules/fiperson/dist
          mkdir -p node_modules/fiperson
          cp ../packages/fiperson/package.json node_modules/fiperson/
          cp -R ../packages/fiperson/dist node_modules/fiperson/dist
          # Same for the gasless client. Pages copies this commit's dist (like fil-folders/fiperson)
          # rather than a git or npm dependency, because @fifolders/sponsored-client is not published
          # and the editors' pin cannot see this commit until after the monorepo is pushed.
          rm -rf node_modules/@fifolders/sponsored-client
          mkdir -p node_modules/@fifolders/sponsored-client
          cp ../packages/sponsored-client/package.json node_modules/@fifolders/sponsored-client/
          cp -R ../packages/sponsored-client/dist node_modules/@fifolders/sponsored-client/dist
          BUILD_ONLY=1 node --disable-warning=ExperimentalWarning --experimental-strip-types p2p/serve.ts
      - run: node scripts/stage-editors.mjs collab-edit/p2p/dist
      - run: printf '%s\n' 'fifolders.scionbase.ai' > apps/fifolders/dist/CNAME
      - run: node scripts/verify-pages-dist.mjs apps/fifolders/dist
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/fifolders/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
